<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Brota</title>
  <meta name="description" content="Planta semillas y haz florecer el jardín. 80 niveles.">
  <meta name="theme-color" content="#fff6ec">

  <!-- PWA en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brota">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <section id="home" class="screen active">
      <div class="home-top">
        <img class="logo" src="icons/icon-192.png" alt="" width="104" height="104">
        <h1>Brota</h1>
        <p class="sub">Planta, piensa y deja que florezca</p>
      </div>
      <div class="home-mid">
        <button id="btn-play" class="btn primary">Jugar</button>
        <div class="meter"><i id="home-bar"></i></div>
        <p id="home-progress" class="progress"></p>
        <div class="pair">
          <button id="btn-garden" class="btn">Mi jardín</button>
          <button id="btn-levels" class="btn">Niveles</button>
        </div>
      </div>
      <div class="home-bottom">
        <button id="btn-sound" class="link">Sonido: sí</button>
        <p id="install-hint" class="install hidden">
          Para instalarla, pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.
        </p>
      </div>
    </section>

    <section id="levels" class="screen">
      <header class="bar">
        <button id="lv-back" class="icon" aria-label="Volver">‹</button>
        <h2>Niveles</h2>
        <span id="lv-count" class="bar-right"></span>
      </header>
      <div id="lv-list" class="scroll"></div>
    </section>

    <section id="garden" class="screen">
      <header class="bar">
        <button id="garden-back" class="icon" aria-label="Volver">‹</button>
        <h2>Mi jardín</h2>
        <span id="garden-count" class="bar-right"></span>
      </header>
      <p class="note">Cada nivel que superas planta una flor aquí.</p>
      <div class="scroll"><canvas id="garden-cv"></canvas></div>
    </section>

    <section id="game" class="screen">
      <header class="bar">
        <button id="g-back" class="icon" aria-label="Inicio">‹</button>
        <h2 id="g-title"></h2>
        <span id="g-left" class="bar-right"></span>
      </header>
      <p id="g-tip"></p>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div id="tray"></div>
      <footer class="tools">
        <button id="g-undo" class="tool"><b>↶</b>Deshacer</button>
        <button id="g-restart" class="tool"><b>⟲</b>Reiniciar</button>
        <button id="g-hint" class="tool"><b>✦</b>Pista</button>
      </footer>

      <div id="win" class="overlay hidden">
        <div class="card">
          <canvas id="win-flower" width="240" height="240"></canvas>
          <h3 id="win-title"></h3>
          <p id="win-text"></p>
          <button id="win-next" class="btn primary">Siguiente</button>
        </div>
      </div>
    </section>

  </main>
  <script type="module" src="js/game.js"></script>
</body>
</html>
